# Настройки на Claude версията. Източниците и темите вече са общи с „lite“:
# вземат се от lite/catalog.yaml, а изборът на теми, градът и думите — от lite/profile.yaml.
# (За нов източник: добави го в lite/catalog.yaml; с only: claude е само за Claude версията.)

# Времето: град и координати (ползва се, само ако профилът няма град).
# Координатите се намират с десен клик в Google Maps върху мястото.
# Пример за Ереван: {name: "Ереван", lat: 40.18, lon: 44.51}
weather: {name: "Пловдив", lat: 42.14, lon: 24.75}

# Настройки
settings:
  max_stories: 17         # колко новини да има във вестника
  hours_back: 24           # колко часа назад да гледаме
  per_source_limit: 12     # максимум новини от един източник
  max_per_topic: 25        # най-много новини от една тема, които вижда Claude
  summary_chars: 400       # колко символа от всяка новина вижда Claude
  interests: "важна политика, България, Армения, технологии и изкуствен интелект (AI)"
  claude_model: "sonnet"
