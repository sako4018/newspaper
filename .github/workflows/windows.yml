# Прави инсталатора за Windows и го пробва на истински Windows с tests/windows_install_test.ps1
# за Lite и за Claude: инсталиране, брой през задачата, архив на Desktop, настройки, деинсталиране.
# При нов таг (например v1.0) след успешната проверка сам прави Release със Sutreshen-Vestnik-Setup.exe.
# Ако Release вече съществува (направен на ръка), само прикачва файла към него.
name: Windows installer

on:
  push:
    branches: [main]
    paths: ["installer/windows/**", "app/**", "claude/**", "lite/**", "tests/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      PYTHONUTF8: "1"   # конзолата на Windows е cp1252 и print на кирилица иначе гърми
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Темите за съветника (topics.isi)
        run: |
          python -m pip install -q pyyaml
          python installer/windows/make_topics.py

      - name: Компилиране със Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist/Sutreshen-Vestnik-Setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Sutreshen-Vestnik-Setup
          path: dist/Sutreshen-Vestnik-Setup.exe

      # Целият път при човек (tests/windows_install_test.ps1): инсталиране, брой през задачата,
      # „Направи брой сега“, смяна на настройките, деинсталиране. Claude е с фалшив claude.
      - name: Проверка Lite
        run: pwsh tests/windows_install_test.ps1 -Exe dist/Sutreshen-Vestnik-Setup.exe -Version lite

      - name: Проверка Claude
        run: pwsh tests/windows_install_test.ps1 -Exe dist/Sutreshen-Vestnik-Setup.exe -Version claude

      - name: Release с инсталатора
        if: github.ref_type == 'tag' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.release.tag_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/Sutreshen-Vestnik-Setup.exe --clobber
          } else {
            gh release create $env:TAG dist/Sutreshen-Vestnik-Setup.exe --title "Сутрешен вестник $env:TAG" `
              --notes 'Инсталатор за Windows. Пусни Sutreshen-Vestnik-Setup.exe. Ако излезе „Windows protected your PC“, натисни More info → Run anyway. Инсталаторът за Mac се добавя към същия Release.'
          }
