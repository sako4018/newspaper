# Прави инсталатора за Windows и го пробва на истински Windows: тихо инсталиране, проверка на
# Python, .venv, профила и задачата в Task Scheduler, един брой Lite и деинсталиране.
# При нов таг (например v1.0) след успешната проверка сам прави Release със Sutreshen-Vestnik-Setup.exe.
# Ако Release вече съществува (направен на ръка), само прикачва файла към него.
name: Windows installer

on:
  push:
    branches: [main]
    paths: ["installer/windows/**", "app/**", "claude/**", "lite/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"   # конзолата на Windows е cp1252 и print на кирилица иначе гърми
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Темите за съветника (topics.isi)
        run: |
          python -m pip install -q pyyaml
          python installer/windows/make_topics.py

      - name: Компилиране със Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist/Sutreshen-Vestnik-Setup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Sutreshen-Vestnik-Setup
          path: dist/Sutreshen-Vestnik-Setup.exe

      - name: Тихо инсталиране (Lite, две теми, Пловдив, 06:30)
        run: |
          $p = Start-Process dist/Sutreshen-Vestnik-Setup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=setup.log', `
            '/version=lite', '/topics=bg,world', '/city=Пловдив', '/time=06:30', '/print=0'
          $app = Join-Path $env:LOCALAPPDATA "Сутрешен вестник"
          Get-Content (Join-Path $app "install.log") -Encoding UTF8 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 40; throw "Setup върна код $($p.ExitCode)" }

      - name: Проверка на инсталацията
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Сутрешен вестник"
          foreach ($f in ".venv\Scripts\python.exe", ".venv\Scripts\pythonw.exe", "Setup.exe", "lite\profile.yaml", "claude\run.py") {
            if (-not (Test-Path (Join-Path $app $f))) { throw "Липсва $f" }
          }
          $prof = Get-Content (Join-Path $app "lite\profile.yaml") -Encoding UTF8 -Raw
          Write-Output $prof
          foreach ($want in "version: lite", "- bg", "- world", "06:30", "Пловдив", "print: false") {
            if (-not $prof.Contains($want)) { throw "Профилът няма '$want'" }
          }
          $task = Get-ScheduledTask -TaskName "Sutreshen Vestnik"
          $at = [datetime]$task.Triggers[0].StartBoundary
          Write-Output ("Задача: " + $task.Actions[0].Execute + " " + $task.Actions[0].Arguments + " в " + $at.ToString("HH:mm"))
          if ($at.ToString("HH:mm") -ne "06:30") { throw "Задачата не е в 06:30" }
          $links = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "*вестник*"
          $links | ForEach-Object { $_.Name }
          if ($links.Count -lt 2) { throw "Липсват преките пътища в Start" }

      - name: Пробен брой Lite (както го пуска задачата)
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Сутрешен вестник"
          & (Join-Path $app ".venv\Scripts\python.exe") (Join-Path $app "claude\run.py")
          $code = $LASTEXITCODE
          Get-Content (Join-Path $app "claude\logs\lite.log") -Encoding UTF8 -Tail 30 -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "run.py върна код $code" }
          $doc = Get-Item (Join-Path $app "lite\output\latest.docx")
          Write-Output ("Брой: " + $doc.FullName + " (" + $doc.Length + " байта)")

      - name: Деинсталиране
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Сутрешен вестник"
          $p = Start-Process (Join-Path $app "unins000.exe") -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep -Seconds 5
          if (Get-ScheduledTask -TaskName "Sutreshen Vestnik" -ErrorAction SilentlyContinue) { throw "Задачата остана" }
          if (Test-Path (Join-Path $app ".venv")) { throw "Папката на програмата остана" }
          Write-Output "Деинсталирано."

      - name: Release с инсталатора
        if: github.ref_type == 'tag' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.release.tag_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/Sutreshen-Vestnik-Setup.exe --clobber
          } else {
            gh release create $env:TAG dist/Sutreshen-Vestnik-Setup.exe --title "Сутрешен вестник $env:TAG" `
              --notes "Инсталатор за Windows. Пусни Sutreshen-Vestnik-Setup.exe. Ако излезе „Windows protected your PC“, натисни More info → Run anyway. Инсталаторът за Mac се добавя към същия Release."
          }
