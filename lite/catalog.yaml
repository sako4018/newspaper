# Каталог с теми за „Вестник Lite“. При първо пускане потребителят избира кои да следи.
# Нова тема: добави блок с id, name, about и sources. По желание keywords: ако е зададено,
# новина от източник на темата се задържа в нея само ако съдържа някоя от думите
# (иначе се води „Свят“ или се пропуска) — за местни теми като България и Армения.

settings:
  hours_back: 24
  per_source_limit: 12

topics:
  - id: bg
    name: България
    about: местни новини и политика
    keywords: [българи, софи, радев, пловдив, варна, бургас, народно събрание, bulgaria, sofia, бнб, евро]
    sources:
      - {name: "БТА",         url: "https://www.bta.bg/bg/rss/free"}
      - {name: "Дневник",     url: "https://www.dnevnik.bg/rss/"}
      - {name: "Медиапул",    url: "https://www.mediapool.bg/feed/"}
      - {name: "Капитал",     url: "https://www.capital.bg/rss/"}
      - {name: "Actualno",    url: "https://www.actualno.com/rss/"}
      - {name: "Club Z",      url: "https://clubz.bg/rss"}
      - {name: "Sofia Globe", url: "https://sofiaglobe.com/feed/"}

  - id: armenia
    name: Армения
    about: новини от и за Армения, Кавказа
    keywords: [армени, armenia, ереван, yerevan, пашинян, pashinyan, карабах, karabakh, сюник, syunik, азербайджан, azerbaijan, հայաստան, հայ, երևան, փաշինյան, ադրբեջան]
    sources:
      - {name: "News.am",    url: "https://news.am/eng/rss/"}
      - {name: "News.am RU", url: "https://news.am/rus/rss/", lang: ru}
      - {name: "Asbarez",    url: "https://asbarez.com/feed/"}
      - {name: "Azatutyun",  url: "https://www.azatutyun.am/api/", lang: hy}
      - {name: "Aravot",     url: "https://www.aravot.am/rss", lang: hy}
      - {name: "Hetq",       url: "https://hetq.am/en/rss"}

  - id: world
    name: Свят
